[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-nuscenes-planning"
version = "0.1.0"
description = "Explicit research-only original nuScenes annotation-to-planning MCAP conversion"
requires-python = ">=3.12"
dependencies = ["mcap==1.4.0"]

[tool.setuptools.packages.find]
where = ["src"]
