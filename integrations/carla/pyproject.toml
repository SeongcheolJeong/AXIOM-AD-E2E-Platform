[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-carla-adapter"
version = "0.8.0"
description = "Optional CARLA worker and HTTP adapter for AXIOM"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
stunt = ["opencv-python-headless>=4.10,<6"]

[project.entry-points."ade2e.adapters"]
carla = "axiom_carla:RemoteCarlaAdapter"

[project.entry-points."ade2e.experiment_handlers"]
carla_streaming = "axiom_carla.multisensor:create_capture_handler"
carla_feedback = "axiom_carla.feedback:create_feedback_handler"
carla_driving_multisensor = "axiom_carla.driving_multisensor:create_driving_multisensor_handler"
carla_city = "axiom_carla.city:create_city_handler"
carla_external_map = "axiom_carla.map_qualification:create_map_qualification_handler"
carla_software_dut = "axiom_carla.hil:create_hil_handler"
carla_stunt = "axiom_carla.stunt:create_stunt_handler"

[tool.setuptools.packages.find]
where = ["src"]
