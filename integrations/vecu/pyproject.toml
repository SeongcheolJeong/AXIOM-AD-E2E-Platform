[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "axiom-vecu"
version = "0.1.0"
description = "Host-process reference vECU replay and CARLA orchestration"
requires-python = ">=3.11"
dependencies = ["axiom-carla-adapter==0.8.0"]
[project.entry-points."ade2e.experiment_handlers"]
vecu = "axiom_vecu:VecuHandler"
[tool.setuptools.packages.find]
where = ["src"]
