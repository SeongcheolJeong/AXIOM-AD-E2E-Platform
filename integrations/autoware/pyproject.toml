[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-autoware"
version = "0.1.0"
description = "Optional, ground-truth Autoware planning and control episode bridge"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
axiom-autoware = "axiom_autoware.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
