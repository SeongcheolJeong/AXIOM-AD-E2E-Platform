[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-onnx-adapter"
version = "0.1.0"
description = "Optional bounded CPU object detection runtime for AXIOM"
requires-python = ">=3.12"
dependencies = ["onnx==1.22.0", "onnxruntime==1.30.0", "numpy==2.5.3", "opencv-python-headless==5.0.0.93"]

[project.entry-points."ade2e.inference_runtimes"]
onnx_cpu = "axiom_onnx:OnnxCpuRuntime"

[tool.setuptools.packages.find]
where = ["src"]
