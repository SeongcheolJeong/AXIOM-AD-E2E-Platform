[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-ade2e-sdk"
version = "0.1.0"
description = "Python client for the AXIOM AD E2E development platform"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
axiom = "axiom_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
