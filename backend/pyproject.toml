[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ade2e"
version = "0.1.0"
description = "Modular AD E2E experiment and evidence platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.9,<3", "mcap==1.4.0", "lz4==4.4.5", "zstandard==0.25.0", "Pillow==12.3.0", "PyYAML>=6.0.2,<7", "numpy>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "mcap-ros2-support==0.5.7"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
